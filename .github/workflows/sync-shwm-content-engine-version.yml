name: Sync SHWM Content Engine version

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-shwm-content-engine-version
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Home Assistant repository
        uses: actions/checkout@v4

      - name: Resolve latest published GHCR beta
        id: version
        shell: bash
        run: |
          set -euo pipefail
          owner="smarthomewithme"
          image="shwm-content-engine"

          token="$(curl --fail --silent --show-error \
            "https://ghcr.io/token?scope=repository:${owner}/${image}:pull" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token") or "")')"
          test -n "${token}"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${token}" \
            "https://ghcr.io/v2/${owner}/${image}/tags/list?n=1000" \
            > /tmp/shwm-ghcr-tags.json

          latest="$(python3 - <<'PY'
          import json, re
          from pathlib import Path

          data = json.loads(Path('/tmp/shwm-ghcr-tags.json').read_text(encoding='utf-8'))
          pattern = re.compile(r'^0\.4\.2-beta\.(\d+)$')
          matches = []
          for tag in data.get('tags') or []:
              match = pattern.fullmatch(str(tag))
              if match:
                  matches.append((int(match.group(1)), tag))
          if not matches:
              raise SystemExit('No 0.4.2-beta.N tag found in public GHCR registry')
          print(max(matches)[1])
          PY
          )"

          # Prove the selected tag resolves to an actual published manifest before
          # Home Assistant is allowed to advertise it.
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${owner}/${image}/manifests/${latest}" \
            >/dev/null

          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "Latest published SHWM beta: ${latest}"

      - name: Update Home Assistant manifest when newer
        id: manifest
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          path = Path('shwm_content_engine/config.yaml')
          text = path.read_text(encoding='utf-8')
          latest = os.environ['LATEST']
          release_pattern = re.compile(r'^0\.4\.2-beta\.(\d+)$')
          latest_match = release_pattern.fullmatch(latest)
          if not latest_match:
              raise SystemExit(f'Unexpected GHCR version: {latest}')

          match = re.search(r'^version:\s*["\']?(0\.4\.2-beta\.\d+)["\']?\s*$', text, flags=re.M)
          if not match:
              raise SystemExit('Home Assistant manifest version line was not found')
          current = match.group(1)
          current_match = release_pattern.fullmatch(current)
          if not current_match:
              raise SystemExit(f'Unexpected current manifest version: {current}')

          current_number = int(current_match.group(1))
          latest_number = int(latest_match.group(1))
          if latest_number < current_number:
              raise SystemExit(f'Refusing manifest downgrade: {current} -> {latest}')
          if latest_number == current_number:
              Path('/tmp/shwm-manifest-changed').write_text('false', encoding='utf-8')
              print(f'Manifest already current: {current}')
              raise SystemExit(0)

          replacement = f'version: "{latest}"'
          text = text[:match.start()] + replacement + text[match.end():]
          path.write_text(text, encoding='utf-8')
          Path('/tmp/shwm-manifest-changed').write_text('true', encoding='utf-8')
          print(f'Updating Home Assistant manifest: {current} -> {latest}')
          PY
          echo "changed=$(cat /tmp/shwm-manifest-changed)" >> "$GITHUB_OUTPUT"

      - name: Commit synchronized manifest
        if: steps.manifest.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "shwm-release-sync"
          git config user.email "actions@users.noreply.github.com"
          git add shwm_content_engine/config.yaml
          git commit -m "release: sync SHWM Content Engine ${LATEST}"
          git push origin HEAD:main
