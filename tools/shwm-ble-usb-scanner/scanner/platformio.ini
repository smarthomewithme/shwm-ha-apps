; Two supported *build targets*, to be validated by GitHub Actions and on hardware.
; Arduino framework / NimBLE v2. Neither firmware contains Wi-Fi credentials.
[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.3.0
build_flags = -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
board = esp32dev

[env:seeed_xiao_esp32c3]
board = seeed_xiao_esp32c3
build_flags = ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1