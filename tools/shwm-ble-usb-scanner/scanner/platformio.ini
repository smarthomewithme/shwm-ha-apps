; SHWM BLE USB Scanner: 23 compiled board targets, catalog lists 45.
; Boards not in this file are listed as YAML-only, no scanner firmware supplied.
[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.3.0
build_flags = -DCORE_DEBUG_LEVEL=0

; ESP32 DevKit / WROOM-32
[env:esp32dev]
board = esp32dev

; NodeMCU-32S
[env:nodemcu-32s]
board = nodemcu-32s

; DOIT ESP32 DevKit V1
[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1

; Wemos LOLIN32
[env:lolin32]
board = lolin32

; Wemos D1 Mini ESP32
[env:wemos_d1_mini32]
board = wemos_d1_mini32

; Espressif ESP32 PICO Kit
[env:pico32]
board = pico32

; ESP-WROVER-KIT
[env:esp-wrover-kit]
board = esp-wrover-kit

; M5Stack ATOM (ESP32)
[env:m5stack-atom]
board = m5stack-atom

; Unexpected Maker TinyPICO
[env:tinypico]
board = tinypico

; Adafruit Feather ESP32 V2
[env:adafruit_feather_esp32_v2]
board = adafruit_feather_esp32_v2

; ESP32-C3 DevKitM-1
[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1

; ESP32-C3 DevKitC-02
[env:esp32-c3-devkitc-02]
board = esp32-c3-devkitc-02

; Seeed XIAO ESP32-C3
[env:seeed_xiao_esp32c3]
board = seeed_xiao_esp32c3
build_flags = ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

; Wemos LOLIN C3 Mini
[env:lolin_c3_mini]
board = lolin_c3_mini
build_flags = ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

