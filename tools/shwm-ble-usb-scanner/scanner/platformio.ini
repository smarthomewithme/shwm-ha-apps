; Six supported ESP32 boards. Build proof in CI, hardware validation still required.
; Arduino framework / NimBLE v2. Neither firmware contains Wi-Fi credentials.
[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.3.0
build_flags = -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
board = esp32dev

[env:seeed_xiao_esp32c3]
board = seeed_xiao_esp32c3
build_flags = ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
; ESP32 NodeMCU-32S (same ESP32 family, explicit image for clear installation)
[env:nodemcu-32s]
board = nodemcu-32s

; ESP32-C3 DevKitM-1 using UART bridge (not Seeed's native USB CDC)
[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1

; ESP32-S3 DevKitC-1: use native USB connector for scanner Serial.
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

; Seeed XIAO ESP32-S3: native USB CDC scanner Serial.
[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
build_flags = ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
